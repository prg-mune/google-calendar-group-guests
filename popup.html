<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendar Group Guests</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="app">
      <header class="header">
        <h1>ゲストグループ</h1>
        <button id="show-form" class="icon-button" type="button" title="グループを追加">+</button>
      </header>

      <section id="notice" class="notice" hidden></section>

      <section id="group-list" class="group-list" aria-label="保存済みグループ"></section>

      <section id="empty-state" class="empty-state" hidden>
        <p>まだグループがありません。</p>
        <button id="empty-create" class="primary-button" type="button">グループを作成</button>
      </section>

      <form id="group-form" class="group-form" hidden>
        <h2 id="form-title" class="form-title">グループを作成</h2>
        <label>
          <span>グループ名</span>
          <input id="group-name" type="text" autocomplete="off" placeholder="例: 開発チーム">
        </label>
        <label>
          <span>メールアドレス</span>
          <textarea id="group-emails" rows="6" placeholder="1行に1件、またはカンマ区切り"></textarea>
        </label>
        <div class="form-actions">
          <button id="save-group" class="primary-button" type="submit">保存</button>
          <button id="cancel-form" class="secondary-button" type="button">キャンセル</button>
        </div>
      </form>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
